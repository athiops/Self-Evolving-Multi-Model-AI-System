name: Federated core tests

on:
  push:
    paths:
      - "backend/federated_core.py"
      - "backend/tests/**"
      - ".github/workflows/federated-tests.yml"
  pull_request:
    paths:
      - "backend/federated_core.py"
      - "backend/tests/**"
      - ".github/workflows/federated-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run federated core tests
        run: python -m pytest -q backend/tests
